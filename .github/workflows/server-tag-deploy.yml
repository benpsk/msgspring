#
# have to use caching or handoff for the jobs stage for faster ci
# Required repository variables:
# - DEPLOY_HOST
# - DEPLOY_USER
# - DEPLOY_FRONTEND_PATH
# - DEPLOY_BACKEND_PATH
# - FRONTEND_PUBLIC_API_BASE_URL
#
# Optional repository variables:
# - DEPLOY_SSH_PORT
# - DEPLOY_FRONTEND_PM2_APP
# - DEPLOY_BACKEND_PM2_APP
# - DEPLOY_FRONTEND_PORT
# - DEPLOY_BACKEND_PORT
#
# Required repository secrets:
# - DEPLOY_SSH_KEY
#
# Optional repository secrets:
# - DEPLOY_KNOWN_HOSTS
#
name: Deploy Server Tag

run-name: Deploy ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy, for example v0.1.0
        required: true
        type: string

env:
  DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: deploy-server-tag
  cancel-in-progress: false

jobs:
  backend-validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.DEPLOY_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e

  backend-package:
    name: Package Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-validate
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.DEPLOY_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune backend to production dependencies
        run: npm prune --omit=dev

      - name: Create backend release archive
        run: |
          set -euo pipefail
          tar -czf ../backend-release.tgz dist scripts node_modules package.json package-lock.json

      - name: Upload backend release archive
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: backend-release.tgz
          if-no-files-found: error
          retention-days: 1

  frontend-validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      FRONTEND_PUBLIC_API_BASE_URL: ${{ vars.FRONTEND_PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.DEPLOY_TAG }}

      - name: Assert build-time frontend env
        run: |
          set -euo pipefail
          : "${FRONTEND_PUBLIC_API_BASE_URL:?Set repository variable FRONTEND_PUBLIC_API_BASE_URL before deploying tags}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.FRONTEND_PUBLIC_API_BASE_URL }}
        run: npm run build

  frontend-package:
    name: Package Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend-validate
    defaults:
      run:
        working-directory: frontend
    env:
      FRONTEND_PUBLIC_API_BASE_URL: ${{ vars.FRONTEND_PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.DEPLOY_TAG }}

      - name: Assert build-time frontend env
        run: |
          set -euo pipefail
          : "${FRONTEND_PUBLIC_API_BASE_URL:?Set repository variable FRONTEND_PUBLIC_API_BASE_URL before deploying tags}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.FRONTEND_PUBLIC_API_BASE_URL }}
        run: npm run build

      - name: Prune frontend to production dependencies
        run: npm prune --omit=dev

      - name: Create frontend release archive
        run: |
          set -euo pipefail
          tar -czf ../frontend-release.tgz .next public node_modules package.json package-lock.json next.config.ts

      - name: Upload frontend release archive
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend-release.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-package
      - frontend-package
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_FRONTEND_PATH: ${{ vars.DEPLOY_FRONTEND_PATH }}
      DEPLOY_BACKEND_PATH: ${{ vars.DEPLOY_BACKEND_PATH }}
      DEPLOY_FRONTEND_PM2_APP: ${{ vars.DEPLOY_FRONTEND_PM2_APP }}
      DEPLOY_BACKEND_PM2_APP: ${{ vars.DEPLOY_BACKEND_PM2_APP }}
      DEPLOY_FRONTEND_PORT: ${{ vars.DEPLOY_FRONTEND_PORT }}
      DEPLOY_BACKEND_PORT: ${{ vars.DEPLOY_BACKEND_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Download backend release archive
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: release/backend

      - name: Download frontend release archive
        uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: release/frontend

      - name: Extract release archives
        run: |
          set -euo pipefail
          mkdir -p release/backend/extracted release/frontend/extracted
          tar -xzf release/backend/backend-release.tgz -C release/backend/extracted
          tar -xzf release/frontend/frontend-release.tgz -C release/frontend/extracted

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_FRONTEND_PATH:?DEPLOY_FRONTEND_PATH is required}"
          : "${DEPLOY_BACKEND_PATH:?DEPLOY_BACKEND_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Ensure deploy directories exist
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_FRONTEND_PATH' '$DEPLOY_BACKEND_PATH'"

      - name: Sync backend release
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p ${DEPLOY_SSH_PORT:-22}" \
            release/backend/extracted/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BACKEND_PATH/"

      - name: Sync frontend release
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p ${DEPLOY_SSH_PORT:-22}" \
            release/frontend/extracted/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_FRONTEND_PATH/"

      - name: Run migrations and restart PM2 apps
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_TAG='$DEPLOY_TAG' \
             DEPLOY_FRONTEND_PATH='$DEPLOY_FRONTEND_PATH' \
             DEPLOY_BACKEND_PATH='$DEPLOY_BACKEND_PATH' \
             DEPLOY_FRONTEND_PM2_APP='${DEPLOY_FRONTEND_PM2_APP:-messagespring-frontend}' \
             DEPLOY_BACKEND_PM2_APP='${DEPLOY_BACKEND_PM2_APP:-messagespring-backend}' \
             DEPLOY_FRONTEND_PORT='${DEPLOY_FRONTEND_PORT:-3001}' \
             DEPLOY_BACKEND_PORT='${DEPLOY_BACKEND_PORT:-3000}' \
             /bin/bash -se" <<'EOF'
          set -euo pipefail

          command -v node > /dev/null
          command -v npm > /dev/null
          command -v pm2 > /dev/null

          cd "$DEPLOY_BACKEND_PATH"
          npm run migrate

          if pm2 describe "$DEPLOY_BACKEND_PM2_APP" > /dev/null 2>&1; then
            NODE_ENV=production PORT="$DEPLOY_BACKEND_PORT" pm2 restart "$DEPLOY_BACKEND_PM2_APP" --update-env
          else
            NODE_ENV=production PORT="$DEPLOY_BACKEND_PORT" pm2 start npm --name "$DEPLOY_BACKEND_PM2_APP" -- run start:prod
          fi

          cd "$DEPLOY_FRONTEND_PATH"

          if pm2 describe "$DEPLOY_FRONTEND_PM2_APP" > /dev/null 2>&1; then
            NODE_ENV=production PORT="$DEPLOY_FRONTEND_PORT" HOSTNAME=0.0.0.0 pm2 restart "$DEPLOY_FRONTEND_PM2_APP" --update-env
          else
            NODE_ENV=production PORT="$DEPLOY_FRONTEND_PORT" HOSTNAME=0.0.0.0 pm2 start npm --name "$DEPLOY_FRONTEND_PM2_APP" -- start -- --hostname 0.0.0.0 --port "$DEPLOY_FRONTEND_PORT"
          fi

          pm2 save
          EOF

      - name: Run backend health check
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "BACKEND_HEALTHCHECK_URL='http://127.0.0.1:${DEPLOY_BACKEND_PORT:-3000}/api/health' /bin/bash -lc 'url=\"\$BACKEND_HEALTHCHECK_URL\"; for attempt in {1..15}; do if curl --fail --silent --show-error \"\$url\" > /dev/null; then exit 0; fi; sleep 2; done; echo \"backend health check failed for \$url\" >&2; exit 1'"

      - name: Run frontend health check
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "FRONTEND_HEALTHCHECK_URL='http://127.0.0.1:${DEPLOY_FRONTEND_PORT:-3001}/' /bin/bash -lc 'url=\"\$FRONTEND_HEALTHCHECK_URL\"; for attempt in {1..15}; do if curl --fail --silent --show-error \"\$url\" > /dev/null; then exit 0; fi; sleep 2; done; echo \"frontend health check failed for \$url\" >&2; exit 1'"
